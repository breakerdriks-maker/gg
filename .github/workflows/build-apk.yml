name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Ekstrak zip proyek
        run: |
          Z=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d" " -f2-)
          echo "Memakai zip: $Z"
          mkdir app
          unzip -q "$Z" -d app
          P=$(dirname "$(find app -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "Proyek ada di: $P"
          echo "P=$P" >> "$GITHUB_ENV"
      - name: Install dependensi
        working-directory: ${{ env.P }}
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/android@7
          npm install --legacy-peer-deps -D @capacitor/cli@7
      - name: Build web
        working-directory: ${{ env.P }}
        run: |
          npm run build
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.warungq.app","appName":"WarungQ","webDir":"dist"}
          JSON
      - name: Build APK
        working-directory: ${{ env.P }}
        run: |
          npx cap add android
          # Ikon aplikasi & layar splash
          RES=android/app/src/main/res
          if [ -d android-res ]; then
            cp -r android-res/mipmap-* "$RES"/
            find "$RES" -name 'splash.png' -exec cp android-res/splash.png {} \;
          fi
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n    <application#' "$M"
          grep -n -E "CAMERA|camera" "$M"
          J=android/app/src/main/java/com/warungq/app/MainActivity.java
          test -f "$J" || { echo "MainActivity tidak ditemukan"; find android -name MainActivity.java; exit 1; }
          cat > "$J" <<'JAVA'
          package com.warungq.app;

          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.LayerDrawable;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.util.Base64;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
              private ActivityResultLauncher<Intent> saveLauncher;
              private byte[] pendingBytes;
              private WebView printWebView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  saveLauncher = registerForActivityResult(
                      new ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          String status = "cancelled";
                          if (result.getResultCode() == RESULT_OK
                                  && result.getData() != null
                                  && result.getData().getData() != null
                                  && pendingBytes != null) {
                              try (OutputStream os = getContentResolver().openOutputStream(result.getData().getData(), "wt")) {
                                  if (os == null) {
                                      throw new Exception("stream null");
                                  }
                                  os.write(pendingBytes);
                                  os.flush();
                                  status = "saved";
                              } catch (Exception e) {
                                  status = "error";
                              }
                          }
                          pendingBytes = null;
                          notifyJs(status);
                      });

                  getBridge().getWebView().addJavascriptInterface(new NativeApi(), "AndroidNative");

                  final Window window = getWindow();
                  WindowCompat.setDecorFitsSystemWindows(window, false);
                  View content = findViewById(android.R.id.content);
                  WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(window, content);
                  controller.setAppearanceLightStatusBars(false);
                  controller.setAppearanceLightNavigationBars(true);
                  final int indigo = Color.parseColor("#4338CA");
                  final int light = Color.parseColor("#F1F5F9");
                  ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                      Insets b = insets.getInsets(
                          WindowInsetsCompat.Type.systemBars()
                              | WindowInsetsCompat.Type.displayCutout()
                              | WindowInsetsCompat.Type.ime());
                      v.setPadding(b.left, b.top, b.right, b.bottom);
                      LayerDrawable bg = new LayerDrawable(new Drawable[] {
                          new ColorDrawable(light), new ColorDrawable(indigo) });
                      bg.setLayerGravity(1, Gravity.TOP);
                      bg.setLayerHeight(1, b.top);
                      window.getDecorView().setBackground(bg);
                      return WindowInsetsCompat.CONSUMED;
                  });
                  ViewCompat.requestApplyInsets(content);
              }

              private void notifyJs(final String status) {
                  final String js = "window.dispatchEvent(new CustomEvent('nativeSaved',{detail:{status:'" + status + "'}}));";
                  runOnUiThread(() -> getBridge().getWebView().evaluateJavascript(js, null));
              }

              private void doPrint(String html, final String jobName, final int widthMm) {
                  final WebView wv = new WebView(this);
                  printWebView = wv;
                  wv.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                          PrintDocumentAdapter adapter = view.createPrintDocumentAdapter(jobName);
                          PrintAttributes.Builder pb = new PrintAttributes.Builder();
                          if (widthMm > 0) {
                              int w = (int) (widthMm / 25.4f * 1000f);
                              pb.setMediaSize(new PrintAttributes.MediaSize("struk", "Struk " + widthMm + " mm", w, 11000));
                              pb.setMinMargins(PrintAttributes.Margins.NO_MARGINS);
                          }
                          pm.print(jobName, adapter, pb.build());
                      }
                  });
                  wv.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
              }

              private class NativeApi {
                  @JavascriptInterface
                  public void saveFile(final String name, final String mime, final String base64) {
                      try {
                          pendingBytes = Base64.decode(base64, Base64.DEFAULT);
                      } catch (Exception e) {
                          notifyJs("error");
                          return;
                      }
                      runOnUiThread(() -> {
                          try {
                              Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                              i.addCategory(Intent.CATEGORY_OPENABLE);
                              i.setType(mime);
                              i.putExtra(Intent.EXTRA_TITLE, name);
                              saveLauncher.launch(i);
                          } catch (Exception e) {
                              pendingBytes = null;
                              notifyJs("error");
                          }
                      });
                  }

                  @JavascriptInterface
                  public void printHtml(final String html, final String jobName, final int widthMm) {
                      runOnUiThread(() -> doPrint(html, jobName, widthMm));
                  }
              }
          }
          JAVA
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/WarungQ.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: WarungQ APK ${{ github.run_number }}
          files: WarungQ.apk
