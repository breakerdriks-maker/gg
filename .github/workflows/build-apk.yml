name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Ekstrak zip proyek
        run: |
          Z=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d" " -f2-)
          echo "Memakai zip: $Z"
          mkdir app
          unzip -q "$Z" -d app
          P=$(dirname "$(find app -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "Proyek ada di: $P"
          echo "P=$P" >> "$GITHUB_ENV"
      - name: Install dependensi
        working-directory: ${{ env.P }}
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/android@7
          npm install --legacy-peer-deps -D @capacitor/cli@7
      - name: Build web
        working-directory: ${{ env.P }}
        run: |
          npm run build
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.warungq.app","appName":"WarungQ","webDir":"dist"}
          JSON
      - name: Build APK
        working-directory: ${{ env.P }}
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <application#' "$M"
          grep -n -E "CAMERA|camera" "$M"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/WarungQ.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: WarungQ APK ${{ github.run_number }}
          files: WarungQ.apk
